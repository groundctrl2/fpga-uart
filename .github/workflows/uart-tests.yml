name: UART Tests

# Run whenever code is pushed or a pull request is opened or updated.
on:
  push:
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ubuntu-latest

    # Run each target as a separate job.
    strategy:
      fail-fast: false
      matrix:
        target:
          - uart_tx
          - uart_rx
          - uart_loopback

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Install cocotb
        run: python -m pip install "cocotb>=2.0,<3.0"

      - name: Run simulation
        run: make TARGET=${{ matrix.target }}
